controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # YENİ: Kol için efor tabanlı kontrolcü
    ur_effort_controller:
      type: effort_controllers/JointGroupEffortController

    # Husky tekerlek kontrolcüsü
    diff_drive_base_controller:
      type: diff_drive_controller/DiffDriveController

# -------------------------------------------------------------------
# UR3 Kol Efor (Tork) Kontrolcü Ayarları
# -------------------------------------------------------------------
ur_effort_controller:
  ros__parameters:
    joints:
      - ur_shoulder_pan_joint
      - ur_shoulder_lift_joint
      - ur_elbow_joint
      - ur_wrist_1_joint
      - ur_wrist_2_joint
      - ur_wrist_3_joint
    # Bu kontrolcü tipi için komut arayüzü varsayılan olarak 'effort' (tork) olur.

# -------------------------------------------------------------------
# Husky Tekerlek Ayarları (değişiklik yok)
# -------------------------------------------------------------------
diff_drive_base_controller:
  ros__parameters:
    left_wheel_names: ["front_left_wheel_joint", "rear_left_wheel_joint"]
    right_wheel_names: ["front_right_wheel_joint", "rear_right_wheel_joint"]

    wheel_separation: 0.512
    wheel_radius: 0.1651

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    pose_covariance_diagonal : [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    open_loop: false
    enable_odom_tf: true

    cmd_vel_timeout: 50.0
    use_stamped_vel: false
